    <text x="68" y="184" fill="#FFF8EC" font-size="64" font-weight="800" letter-spacing="-2">Sanket Kurle</text>
    <text x="70" y="231" fill="#F4E8D4" font-size="23" font-weight="500">Full-stack · Cloud · Mobile · Open source</text>
    <text x="70" y="287" fill="#D8BD92" font-size="15" font-weight="700" letter-spacing="2">BUILDING THE NEXT MOVE · MUMBAI, INDIA</text>
