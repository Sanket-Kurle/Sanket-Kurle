<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Sanket Kurle — Full-stack Software Engineer</title>
  <desc id="desc">An emerald and ivory portfolio banner with a modern pawn mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#043D30"/>
      <stop offset="0.65" stop-color="#07513F"/>
      <stop offset="1" stop-color="#032B23"/>
    </linearGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#D8BD92"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
